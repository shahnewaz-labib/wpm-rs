name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: wpm-rs-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: wpm-rs-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: wpm-rs-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: wpm-rs-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/wpm-rs artifacts/${{ matrix.artifact }}

      - name: Prepare artifact (windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/wpm-rs.exe artifacts/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
